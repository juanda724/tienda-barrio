spring.application.name=tienda-barrio

# Nombre con el que la tienda firma los pedidos que envía a los proveedores
tienda.nombre=Tienda de Barrio

# Datos del emisor en la factura electrónica de venta (SWR-32). Son de ejemplo: cambie los de su tienda
tienda.razon-social=Tienda de Barrio
tienda.nit=123456789-6
tienda.direccion=Carrera 15 # 20-30
tienda.telefono=300 123 4567
# true: la tienda es responsable de IVA. false: la factura dice "No responsable de IVA"
tienda.responsable-iva=false

# Resolución de numeración de facturación: prefijo, rango autorizado y vigencia (fechas AAAA-MM-DD).
# Es simulada: el prototipo no se conecta con la DIAN. La clave técnica entra en el cálculo del CUFE
tienda.factura.resolucion=18760000001
tienda.factura.resolucion-fecha=2026-01-01
tienda.factura.prefijo=FE
tienda.factura.desde=1
tienda.factura.hasta=5000
tienda.factura.vigente-hasta=2027-12-31
tienda.factura.clave-tecnica=fc8eac422eba16e22ffd8c6f94b3f40a6e38162c

server.port=8080

# Base de datos H2 en archivo (./data), no requiere instalación
spring.datasource.url=jdbc:h2:file:./data/tienda-barrio
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fotos de evidencia de las devoluciones (F-07), junto a la base de datos
tienda.evidencias.carpeta=./data/evidencias
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Carga productos y proveedores de ejemplo si la base está vacía
tienda.datos-demo=true
