spring.application.name=tienda-barrio

# Nombre con el que la tienda firma los pedidos que envía a los proveedores
tienda.nombre=Tienda de Barrio

server.port=8080

# Base de datos H2 en archivo (./data), no requiere instalación
spring.datasource.url=jdbc:h2:file:./data/tienda-barrio
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fotos de evidencia de las devoluciones (F-07), junto a la base de datos
tienda.evidencias.carpeta=./data/evidencias
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Carga productos y proveedores de ejemplo si la base está vacía
tienda.datos-demo=true
