spring.application.name=tienda-barrio
server.port=8080

# Base de datos H2 en archivo (./data), no requiere instalación
spring.datasource.url=jdbc:h2:file:./data/tienda-barrio
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Carga productos y proveedores de ejemplo si la base está vacía
tienda.datos-demo=true
